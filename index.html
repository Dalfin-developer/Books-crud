<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h1 class="text-primary text-center">Book Library</h1>
        
        <form action="" class="mt-5" id="bookForm">
            <input id="edit" type="text" hidden>
            <div class="row">
            <div class="col-lg-3">
                <input id="Book_name" type="text" placeholder="Book Name" class="form-control">
            </div>
            <div class="col-lg-3">
                <input  id="author" type="text" placeholder="Author" class="form-control">
            </div>
            <div class="col-lg-3">
                <select name="" id="category" class="form-control">
                    <option value="" selected disabled  >category</option>
                    <option value="Romance">Romance</option>
                    <option value="Comedy">Comedy</option>
                    <option value="Science">Science</option>
                    <option value="History">History</option>
                </select>
            </div>
            <div class="col-lg-3">
                <button id="addBook" class="btn btn-success w-100" type="submit">ADD BOOK</button>
            </div>
            </div>
            <div class="row my-4">
               <div class="col-lg-6"> <input id="searchCategory" type="text" placeholder="search book category" class="form-control"></div>
               <div class="col-lg-6"><input id="searchAuthor" type="text" placeholder="search author" class="form-control"></div>
            </div>
        </form>
        <table class="table table-bordered table-hover mt-5">
            <thead class="table-dark">
                <tr>
                    <th>Id</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>category</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="booksBody" class="table-secondary">
                <!-- <tr>
                    <td>#</td>
                    <td>Book Name</td>
                    <td>author</td>
                    <td>category</td>
                    <td><button class="btn btn-warning me-3">Edit</button><button class="btn btn-danger">Delete</button></td>
                </tr> -->
            </tbody>
        </table>
        </div>
    </div>
</body>
<script src="./main.js"></script>
</html>
